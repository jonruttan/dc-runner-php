name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compatibility-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP + yaml extension
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-yaml
          php -m | grep -i ^yaml
      - name: Lint
        run: make lint
      - name: Smoke
        run: make smoke
      - name: Spec Sync Check
        run: make spec-sync-check
      - name: Compatibility Check
        run: make compat-check
