name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build PHP Release Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          PREFIX="dc-runner-php-${VERSION}"
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "dist/${PREFIX}.tar.gz" HEAD
          git archive --format=zip --prefix="${PREFIX}/" -o "dist/${PREFIX}.zip" HEAD
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-php
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
